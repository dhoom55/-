name: Build Jarvis for Windows

# Jarvis ships for Windows only: every job runs on a real Windows machine.

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx python-docx
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller -r requirements-optional.txt
      - run: python build_exe.py
      - name: Self-test the built Jarvis.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Jarvis/Jarvis.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content dist/Jarvis/selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist/Jarvis/selftest.txt
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('Jarvis-Windows', 'zip', 'dist', 'Jarvis')"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: Jarvis-Windows.zip

  local-ai:
    # Real end-to-end on Windows: Jarvis installs Ollama by itself, downloads a model, answers with it,
    # writes and runs code, makes a presentation, and Agent X learns from real GitHub.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx python-docx
      - run: python tests/e2e_ollama.py qwen2.5:0.5b
        env:
          GITHUB_TOKEN: ${{ github.token }}   # Agent X: higher GitHub API limits

  release:
    # Every merge to main publishes Jarvis-Windows.zip under "Releases" - only if everything passed.
    if: github.ref == 'refs/heads/main'
    needs: [build, local-ai]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4          # for the Arabic release notes
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.${{ github.run_number }}" --repo "${{ github.repository }}" \
            --title "جارفيس v0.${{ github.run_number }}" --latest \
            --notes-file .github/release-notes.md \
            Jarvis-Windows.zip
